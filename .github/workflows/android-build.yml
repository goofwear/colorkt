name: Android CI

# Trigger on pushes to branches and on PRs
on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Set up Java (use JDK 17 or whichever your project uses)
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # 3) Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 4) Optional: set up Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # You can change packages if you need build tools etc.
          packages: tools platform-tools

      # 5) Build the app
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 6) Upload the APK as an artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
